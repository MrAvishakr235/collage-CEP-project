<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Change Password</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body class="app-page account-page"><a class="skip-link" href="#main-content">Skip to main content</a><header class="top-header"><a class="brand" href="login.html">School Name Placeholder</a><p>School Management Portal</p><a href="profile.html">Profile</a></header><main id="main-content" class="form-page"><header class="page-heading"><p class="eyebrow">Account security</p><h1>Change Password</h1><p>This form will be connected to secure account management in the backend stage.</p></header><form id="change-password-form" action="profile.html" method="post" data-api-endpoint="/api/change-password"><fieldset><legend>Set a new password</legend><p><label for="current-password">Current password</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required></p><p><label for="new-password">New password</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" required></p><p><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required></p></fieldset><p class="form-actions"><button type="submit" data-action="change-password">Update password</button><a href="profile.html">Cancel</a></p></form></main></body></html>
